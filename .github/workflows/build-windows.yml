# Build a double-click PDFStudio.exe for Windows (no Python needed for end users).
name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build with PyInstaller
        run: python -m PyInstaller --noconfirm packaging/PDFStudio.spec

      - name: Verify EXE exists
        shell: bash
        run: |
          test -f dist/PDFStudio.exe
          ls -lh dist/PDFStudio.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDFStudio-windows
          path: dist/PDFStudio.exe
          if-no-files-found: error
          retention-days: 30

      - name: Attach EXE to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PDFStudio.exe
          fail_on_unmatched_files: true
